<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор ППС/NGT</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h1>Калькулятор ППС/NGT</h1>

    <select id="calcType">
        <option value="pps">ППС</option>
        <option value="ngt">NGT-3</option>
        <option value="both">Оба</option>
    </select>

    <div id="ppsSection">
        <h3>ППС</h3>
        <input type="number" id="ppsToPrepare" placeholder="ППС (м³)">
    </div>

    <div id="ngtSection">
        <h3>NGT</h3>
        <input type="number" id="ngtToPrepare" placeholder="NGT (м³)">
    </div>

    <button onclick="calculate()">Рассчитать</button>

    <div id="results"></div>
</div>

<script src="script.js"></script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>
</body>
</html>
