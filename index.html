<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Калькулятор ППС/NGT</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">

<h1>Калькулятор ППС/NGT</h1>

<label>Тип расчета:</label>
<select id="calcType">
  <option value="0">ППС</option>
  <option value="1">NGT-3</option>
  <option value="2">Оба</option>
</select>

<!-- Поле тип ППС (ОГП/ОВП) -->
<label id="ogpLabel">Тип ППС:</label>
<select id="ogpOvp">
  <option value="ogp">ОГП</option>
  <option value="ovp">ОВП</option>
</select>

<!-- Поля для ввода объёма -->
<input id="ppsToPrepare" placeholder="Сколько ППС">
<input id="ngtToPrepare" placeholder="Сколько NGT">

<button onclick="calculate()">Рассчитать</button>

<div id="results"></div>

</div>

<script src="script.js"></script>
</body>
</html>
