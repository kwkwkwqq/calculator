<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Калькулятор ППС/NGT</title>
<link rel="stylesheet" href="style.css">
</head>

<body>
<div class="container">

<h1>Калькулятор ППС/NGT</h1>

<label>Тип расчета:</label>
<select id="calcType">
  <option value="0">ППС</option>
  <option value="1">NGT-3</option>
  <option value="2">Оба</option>
</select>

<label id="ogpLabel">Тип:</label>
<select id="ogpOvp">
  <option>ОГП</option>
  <option>ОВП</option>
</select>

<input id="ppsVolume" placeholder="Объем ППС">
<input id="ngtVolume" placeholder="Объем NGT">
<input id="ppsToPrepare" placeholder="Сколько ППС">
<input id="ngtToPrepare" placeholder="Сколько NGT">

<button onclick="calculate()">Рассчитать</button>

<div id="results"></div>

</div>

<script src="script.js"></script>
</body>
</html>
